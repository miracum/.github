apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "test-chart.fullname" . }}-test-connection"
  labels:
    {{- include "test-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    # one-shot restartPolicy:Never helm test hook, not a long-running workload
    checkov.io/skip1: "CKV_K8S_8=not a long-running workload"
    checkov.io/skip2: "CKV_K8S_9=not a long-running workload"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.36.1
      command: ['wget']
      # --spider: check reachability without downloading/writing the
      # response body, which would otherwise fail under the read-only root
      # filesystem below (wget defaults to saving it as ./index.html).
      args: ['--spider', '{{ include "test-chart.fullname" . }}:{{ .Values.service.port }}']
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
  restartPolicy: Never
