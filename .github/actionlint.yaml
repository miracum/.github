paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # actionlint doesn't yet recognize GitHub's newer self-repository "uses: $/..." syntax
      # for reusable workflow calls (added July 2026). Remove once actionlint supports it.
      # https://github.com/rhysd/actionlint/issues
      - 'reusable workflow call ".+" at "uses" is not following the format'
