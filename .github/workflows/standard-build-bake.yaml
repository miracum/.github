name: Standard workflow for building container images from a Docker Buildx Bake file

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: 0.72.0
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
  TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1

on:
  workflow_call:
    inputs:
      bake-files:
        description: "List of docker buildx bake definition files to build from, e.g. `docker-bake.hcl`. See <https://docs.docker.com/build/bake/reference/>"
        required: true
        type: string
      bake-targets:
        description: "List of bake targets and/or groups to build. Defaults to the bake file's `default` group"
        required: false
        default: ""
        type: string
      bake-set:
        description: "Additional bake target overrides, one per line, in the form `targetpattern.key=value`. See <https://docs.docker.com/reference/cli/docker/buildx/bake/#set>"
        required: false
        default: ""
        type: string
      bake-vars:
        description: "Bake variables to set, one per line, in `KEY=value` form. Useful for e.g. passing a computed version/tag into the bake file"
        required: false
        default: ""
        type: string
      enable-upload-image:
        description: "If enabled, save every image built during a pull_request build as a docker-loadable tar and upload it as a single `images` artifact, with each file inside named `<slug>.tar`"
        required: false
        default: true
        type: boolean
      enable-trivy-scan:
        description: "If enabled, scan every image built by bake using trivy and publish a signed attestation"
        required: false
        default: true
        type: boolean
      trivy-ignore-unfixed:
        description: "Ignore unfixed/unfixable vulnerabilities in reports"
        required: false
        default: true
        type: boolean
      platforms:
        description: "List of target platforms for build"
        required: false
        type: string
        default: |
          linux/amd64
      free-disk-space:
        description: remove unneeded packages
        required: false
        type: boolean
        default: true
    outputs:
      images:
        value: ${{ jobs.build.outputs.images }}
        description: >-
          JSON array with one entry per image built by bake, each with the
          keys `target` (the bake target name), `name` (image name without
          tag), `tags` (array of tags), `digest`, and `slug` (a
          filesystem/artifact-name-safe version of the first tag, also used
          as the `<slug>.tar` filename inside the `images` artifact when
          `enable-upload-image` is set).
    secrets:
      github-token:
        description: "The GitHub workflow token used to push to ghcr.io. Also used by trivy"
        required: true

jobs:
  build:
    name: build images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # for uploading trivy scan results to security tab
      security-events: write
      # for the trivy PR comment
      pull-requests: write
    outputs:
      images: ${{ steps.images.outputs.matrix }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # <https://docs.docker.com/storage/containerd/>
      # via <https://github.com/docker/setup-buildx-action/issues/257>
      - name: Set up containerd image store
        shell: bash
        run: |
          [ -f /etc/docker/daemon.json ] || echo "{}" | sudo tee /etc/docker/daemon.json
          jq '. | .+{"features": {"containerd-snapshotter": true}}' /etc/docker/daemon.json > /tmp/docker-daemon-with-containerd.json
          sudo mv /tmp/docker-daemon-with-containerd.json /etc/docker/daemon.json
          cat /etc/docker/daemon.json
          sudo systemctl restart docker

          docker info -f '{{ .DriverStatus }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # zizmor: runtime artifacts potentially vulnerable to a cache poisoning attack
          cache-binary: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Free disk space
        if: ${{ inputs.free-disk-space }}
        uses: endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1 # v3.2.2
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          rm_cmd: "rmz"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token }}

      # pull_request builds (from a fork or not) are never pushed to the
      # registry: they're loaded into the local docker daemon instead, so
      # they can still be scanned by trivy below and, if enabled, saved as
      # tar artifacts. this is a deliberate simplification compared to the
      # Dockerfile-based standard-build workflow, which also pushes
      # same-repo PR builds -- doing so here would require a per-target
      # dual-output (push + local) `--set` override, which isn't reliably
      # expressible without first resolving the bake file's target names.
      # non-PR events push straight to the registry with the same
      # oci-mediatype+zstd settings used by the standard, non-bake, build
      # workflow.
      - name: Build and push images
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          files: ${{ inputs.bake-files }}
          targets: ${{ inputs.bake-targets }}
          vars: ${{ inputs.bake-vars }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || false }}
          sbom: ${{ github.event_name != 'pull_request' }}
          set: |
            *.platform=${{ inputs.platforms }}
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            *.output=${{ github.event_name != 'pull_request' && 'type=image,push=true,oci-mediatypes=true,compression=zstd,force-compression=true' || 'type=docker' }}
            ${{ inputs.bake-set }}

      - name: display images
        run: |
          docker image ls -a

      - name: Compute image matrix
        id: images
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          jq -c '
            [
              to_entries[]
              | {
                  target: .key,
                  digest: .value["containerimage.digest"],
                  tags: ((.value["image.name"] // "") | split(",")),
                }
              | . + {
                  name: (.tags[0] // "" | sub("@sha256:.*$"; "") | sub("(:[^/:]+)$"; "")),
                  slug: ((.tags[0] // .target) | gsub("[^a-zA-Z0-9]"; "-")),
                }
            ]
          ' <<<"${METADATA}" | tee images.json
          echo "matrix=$(jq -c . images.json)" >> "$GITHUB_OUTPUT"

      - name: Save images as tar archives
        if: ${{ github.event_name == 'pull_request' && inputs.enable-upload-image }}
        run: |
          mkdir -p images
          jq -c '.[]' images.json | while IFS= read -r image; do
            tag=$(jq -r '.tags[0]' <<<"${image}")
            slug=$(jq -r '.slug' <<<"${image}")
            docker save "${tag}" -o "images/${slug}.tar"
          done

      - name: Upload images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ github.event_name == 'pull_request' && inputs.enable-upload-image }}
        with:
          name: images
          path: |
            images/

      - name: install trivy
        run: |
          wget "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          sudo dpkg -i "trivy_${TRIVY_VERSION}_Linux-64bit.deb"

      - name: Download PR comment template
        if: ${{ inputs.enable-trivy-scan }}
        run: |
          curl -o trivy-pr-report.md.tpl https://raw.githubusercontent.com/miracum/.github/master/.github/trivy-pr-report.md.tpl

      - name: Scan images with trivy and generate SBOMs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRIVY_IGNORE_UNFIXED: ${{ inputs.trivy-ignore-unfixed }}
          ENABLE_TRIVY_SCAN: ${{ inputs.enable-trivy-scan }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          TMPDIR: /tmp
        run: |
          mkdir -p sboms trivy-attestations

          jq -c '.[]' images.json | while IFS= read -r image; do
            tag=$(jq -r '.tags[0]' <<<"${image}")
            slug=$(jq -r '.slug' <<<"${image}")

            echo "::group::${tag}"

            if [ "${ENABLE_TRIVY_SCAN}" = "true" ]; then
              trivy image \
                --exit-code=0 \
                --format=cosign-vuln \
                --output="trivy-attestations/${slug}-trivy-vuln-attestation.json" \
                --ignore-unfixed="${TRIVY_IGNORE_UNFIXED}" \
                "${tag}"

              if [ "${IS_PR}" = "true" ]; then
                trivy image \
                  --exit-code=0 \
                  --format=template \
                  --output="/tmp/${slug}-trivy-pr-report.md" \
                  --template="@trivy-pr-report.md.tpl" \
                  --ignore-unfixed="${TRIVY_IGNORE_UNFIXED}" \
                  "${tag}"

                {
                  echo "### \`${tag}\`"
                  echo
                  cat "/tmp/${slug}-trivy-pr-report.md"
                  echo
                } >> trivy-pr-report-combined.md
              fi
            fi

            trivy image --format cyclonedx -o "sboms/${slug}-sbom.cdx.json" "${tag}"
            trivy image --format spdx-json -o "sboms/${slug}-sbom.spdx.json" "${tag}"

            echo "::endgroup::"
          done

      - name: Upload image vulnerability attestations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.enable-trivy-scan }}
        with:
          name: trivy-attestations
          path: |
            trivy-attestations/

      - name: Add trivy report PR comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        # when running from a fork, the CI token doesn't have enough permissions to create PR comments
        if: ${{ github.event_name == 'pull_request' && inputs.enable-trivy-scan && !github.event.pull_request.head.repo.fork }}
        with:
          recreate: true
          header: "trivy-report-comment"
          path: trivy-pr-report-combined.md

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: |
            ./sboms/

  image-provenance:
    name: attest image provenance (${{ matrix.image.target }})
    runs-on: ubuntu-24.04
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs:
      - build
    strategy:
      matrix:
        image: ${{ fromJson(needs.build.outputs.images) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write # for pushing the attestation to ghcr.io.
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ matrix.image.name }}
          subject-digest: ${{ matrix.image.digest }}
          push-to-registry: true

  sign-images:
    name: sign image (${{ matrix.image.target }})
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - build
    strategy:
      matrix:
        image: ${{ fromJson(needs.build.outputs.images) }}
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        env:
          IMAGE: "${{ matrix.image.name }}@${{ matrix.image.digest }}"
        run: |
          echo "Signing '$IMAGE' using keyless approach"
          cosign sign --yes "${IMAGE}"

  attest-trivy-vulnerability-report:
    name: attest trivy vulnerability report (${{ matrix.image.target }})
    runs-on: ubuntu-24.04
    if: ${{ github.event_name != 'pull_request' && inputs.enable-trivy-scan }}
    needs:
      - build
    strategy:
      matrix:
        image: ${{ fromJson(needs.build.outputs.images) }}
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token }}

      - name: Download attestations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trivy-attestations
          path: /tmp

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Attest image vulnerability report
        env:
          IMAGE: "${{ matrix.image.name }}@${{ matrix.image.digest }}"
          PREDICATE: "/tmp/${{ matrix.image.slug }}-trivy-vuln-attestation.json"
        run: |
          echo "Attest vulnerability report for '$IMAGE' using keyless approach"
          cosign attest --yes --type vuln --predicate "${PREDICATE}" "${IMAGE}"

  upload-attestation-to-release:
    name: upload slsa attestations to release assets (${{ matrix.image.target }})
    runs-on: ubuntu-24.04
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs:
      - image-provenance
      - build
    strategy:
      matrix:
        image: ${{ fromJson(needs.build.outputs.images) }}
    permissions:
      # to upload artifacts to the release
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: download attestation from image
        env:
          GH_TOKEN: ${{ secrets.github-token }}
          IMAGE: "${{ matrix.image.name }}@${{ matrix.image.digest }}"
          IMAGE_DIGEST: "${{ matrix.image.digest }}"
          IMAGE_SLUG: "${{ matrix.image.slug }}"
          REPO: ${{ github.repository }}
        run: |
          gh attestation download "oci://${IMAGE}" \
            --repo="${REPO}" \
            --predicate-type="https://slsa.dev/provenance/v1"
          mv "${IMAGE_DIGEST}.jsonl" "${IMAGE_SLUG}.intoto.jsonl"

      - name: upload assets to release
        # zizmor: ignore[superfluous-actions] upload release assets directly
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            *.intoto.jsonl

  upload-sbom-to-release:
    name: upload image SBOMs to release assets
    runs-on: ubuntu-24.04
    needs:
      - build
    permissions:
      # to upload artifacts to the release
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: Download sboms
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sboms
          path: ./sboms

      - name: Display structure of downloaded files
        run: ls -R .

      - name: upload assets to release
        # zizmor: ignore[superfluous-actions] upload release assets directly
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          fail_on_unmatched_files: true
          files: |
            ./sboms/*.json
