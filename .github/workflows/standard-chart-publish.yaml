name: Standard workflow for publishing a Helm chart as an OCI artifact

permissions:
  contents: read

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      chart-path:
        description: "Path to the directory containing the chart's Chart.yaml"
        required: true
        type: string
      registry:
        description: "OCI registry (and optional path prefix) to push the chart to. The chart is pushed as `<registry>/<chart name>:<chart version>`."
        required: false
        default: "ghcr.io/${{ github.repository }}"
        type: string
      version:
        description: "Overrides the chart version from Chart.yaml. Passed to `helm package --version`."
        required: false
        default: ""
        type: string
      app-version:
        description: "Overrides the appVersion from Chart.yaml. Passed to `helm package --app-version`."
        required: false
        default: ""
        type: string
      enable-dependency-update:
        description: "If enabled, runs `helm dependency update` before packaging the chart."
        required: false
        default: true
        type: boolean
      enable-sign:
        description: "If enabled, signs the pushed chart with cosign using keyless OIDC signing."
        required: false
        default: true
        type: boolean
      enable-provenance-attestation:
        description: "If enabled, publishes a signed SLSA build provenance attestation for the pushed chart."
        required: false
        default: true
        type: boolean
    outputs:
      chart-name:
        value: ${{ jobs.publish.outputs.chart-name }}
        description: "The name of the packaged chart, as read from Chart.yaml"
      chart-version:
        value: ${{ jobs.publish.outputs.chart-version }}
        description: "The version of the packaged chart"
      chart-digest:
        value: ${{ jobs.publish.outputs.chart-digest }}
        description: "The digest of the chart pushed to the registry"
      chart-reference:
        value: ${{ jobs.publish.outputs.chart-reference }}
        description: "The full `registry/chart-name:version` reference of the pushed chart"
    secrets:
      github-token:
        description: "The GitHub workflow token used to push to ghcr.io"
        required: true

jobs:
  publish:
    name: publish chart
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # to push the chart and its signature/attestation to ghcr.io
      id-token: write # for OIDC-based keyless cosign signing and attestations
      attestations: write # to publish the build provenance attestation
      artifact-metadata: write # required by actions/attest-build-provenance
    outputs:
      chart-name: ${{ steps.chart_meta.outputs.name }}
      chart-version: ${{ steps.chart_meta.outputs.version }}
      chart-digest: ${{ steps.push.outputs.digest }}
      chart-reference: ${{ steps.push.outputs.reference }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Update chart dependencies
        if: ${{ inputs.enable-dependency-update }}
        working-directory: ${{ inputs.chart-path }}
        run: |
          helm dependency update .

      - name: Lint chart
        working-directory: ${{ inputs.chart-path }}
        run: |
          helm lint .

      - name: Read chart metadata
        id: chart_meta
        working-directory: ${{ inputs.chart-path }}
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
          APP_VERSION_OVERRIDE: ${{ inputs.app-version }}
        run: |
          NAME="$(yq '.name' Chart.yaml)"
          VERSION="${VERSION_OVERRIDE:-$(yq '.version' Chart.yaml)}"
          APP_VERSION="${APP_VERSION_OVERRIDE:-$(yq '.appVersion' Chart.yaml)}"
          {
            echo "name=${NAME}"
            echo "version=${VERSION}"
            echo "app-version=${APP_VERSION}"
          } >> "${GITHUB_OUTPUT}"

      - name: Package chart
        id: package
        env:
          CHART_PATH: ${{ inputs.chart-path }}
          CHART_VERSION: ${{ steps.chart_meta.outputs.version }}
          CHART_APP_VERSION: ${{ steps.chart_meta.outputs.app-version }}
        run: |
          mkdir -p .chart-packages
          helm package "${CHART_PATH}" \
            --destination .chart-packages \
            --version "${CHART_VERSION}" \
            --app-version "${CHART_APP_VERSION}"
          echo "path=$(find .chart-packages -name '*.tgz')" >> "${GITHUB_OUTPUT}"

      # only push when not running on a pull_request from a fork, since forks
      # don't have access to the registry credentials.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.base.repo.full_name == github.event.pull_request.head.repo.full_name) }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token }}

      - name: Push chart to registry
        id: push
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.base.repo.full_name == github.event.pull_request.head.repo.full_name) }}
        env:
          CHART_PACKAGE: ${{ steps.package.outputs.path }}
          REGISTRY: ${{ inputs.registry }}
        run: |
          # helm writes the "Pushed:"/"Digest:" confirmation to stderr on
          # some versions and stdout on others, so capture both instead of
          # relying on either one specifically.
          helm push "${CHART_PACKAGE}" "oci://${REGISTRY}" > .push-output 2>&1
          cat .push-output
          {
            echo "reference=$(awk -F "[, ]+" '/Pushed:/{print $NF}' .push-output)"
            echo "digest=$(awk -F "[, ]+" '/Digest:/{print $NF}' .push-output)"
          } >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ inputs.enable-sign && (github.event_name != 'pull_request' || (github.event.pull_request.base.repo.full_name == github.event.pull_request.head.repo.full_name)) }}

      - name: Sign chart
        if: ${{ inputs.enable-sign && (github.event_name != 'pull_request' || (github.event.pull_request.base.repo.full_name == github.event.pull_request.head.repo.full_name)) }}
        env:
          CHART_REF: "${{ inputs.registry }}/${{ steps.chart_meta.outputs.name }}@${{ steps.push.outputs.digest }}"
        run: |
          echo "Signing '${CHART_REF}' using keyless approach"
          cosign sign --yes "${CHART_REF}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ inputs.enable-provenance-attestation && (github.event_name != 'pull_request' || (github.event.pull_request.base.repo.full_name == github.event.pull_request.head.repo.full_name)) }}
        with:
          subject-name: "${{ inputs.registry }}/${{ steps.chart_meta.outputs.name }}"
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
