name: Standard workflow for testing and publishing a Helm chart as an OCI artifact

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # renovate: datasource=github-releases depName=helm/chart-testing
  CT_VERSION: 3.14.0

on:
  workflow_call:
    inputs:
      chart-path:
        description: "Path to the directory containing the chart's Chart.yaml"
        required: true
        type: string
      registry:
        description: "OCI registry (and optional path prefix) to push the chart to. The chart is pushed as `<registry>/<chart name>:<chart version>`."
        required: false
        default: "ghcr.io/${{ github.repository }}"
        type: string
      version:
        description: "Overrides the chart version from Chart.yaml. Passed to `helm package --version`. If unset, a release event uses its tag name and a pull_request event gets a `<chart version>-pr<number>.<short sha>` prerelease version."
        required: false
        default: ""
        type: string
      app-version:
        description: "Overrides the appVersion from Chart.yaml. Passed to `helm package --app-version`."
        required: false
        default: ""
        type: string
      enable-dependency-update:
        description: "If enabled, runs `helm dependency update` before linting/testing/packaging the chart."
        required: false
        default: true
        type: boolean
      enable-sign:
        description: "If enabled, signs the pushed chart with cosign using keyless OIDC signing."
        required: false
        default: true
        type: boolean
      enable-provenance-attestation:
        description: "If enabled, publishes a signed SLSA build provenance attestation for the pushed chart."
        required: false
        default: true
        type: boolean
      target-branch:
        description: "Branch to diff against when detecting changed charts for linting/testing"
        required: false
        default: "${{ github.event.repository.default_branch }}"
        type: string
      lint-config:
        description: "Path to a ct lint configuration file. Leave empty to use ct's defaults."
        required: false
        default: ""
        type: string
      lint-all:
        description: "If enabled, lints all charts next to chart-path on every run instead of only ones changed vs. target-branch"
        required: false
        default: true
        type: boolean
      enable-install:
        description: "If enabled, spins up a kind cluster and installs charts changed vs. target-branch using ct install"
        required: false
        default: true
        type: boolean
      install-config:
        description: "Path to a ct install configuration file. Leave empty to use ct's defaults."
        required: false
        default: ""
        type: string
      install-all:
        description: "If enabled, installs all charts next to chart-path on every run instead of only ones changed vs. target-branch. Unlike lint-all, this defaults to false: spinning up a kind cluster and installing is far more expensive than linting, so unconditionally doing it on every run isn't a safe default for every caller. Callers that need install to run on more than chart-path changes (e.g. because a PR only changed the application image consumed via helm-extra-set-args) should compute this themselves and pass it through."
        required: false
        default: false
        type: boolean
      helm-extra-set-args:
        description: "Passed through to `ct install`'s `--helm-extra-set-args`, e.g. to point the chart at a just-built PR image for testing: '--set=image.tag=pr-123'. Has no effect on lint - chart-testing doesn't support this flag there, and lint never pulls the image anyway."
        required: false
        default: ""
        type: string
      k8s-versions:
        description: "JSON array of kind node image versions to test installation against"
        required: false
        default: '["1.34.8", "1.35.5", "1.36.1"]'
        type: string
      enable-pr-release:
        description: "If enabled, also publishes the chart (as a prerelease version) for pull_request events, in addition to release events"
        required: false
        default: true
        type: boolean
      extra-helm-repos:
        description: "Extra Helm chart repositories to add before linting/testing/packaging, as newline-separated 'name=url' pairs"
        required: false
        default: ""
        type: string
    outputs:
      chart-name:
        value: ${{ jobs.publish.outputs.chart-name }}
        description: "The name of the packaged chart, as read from Chart.yaml"
      chart-version:
        value: ${{ jobs.publish.outputs.chart-version }}
        description: "The version of the packaged chart"
      chart-digest:
        value: ${{ jobs.publish.outputs.chart-digest }}
        description: "The digest of the chart pushed to the registry"
      chart-reference:
        value: ${{ jobs.publish.outputs.chart-reference }}
        description: "The full `registry/chart-name:version` reference of the pushed chart"
    secrets:
      github-token:
        description: "The GitHub workflow token used to push to ghcr.io"
        required: true

jobs:
  lint:
    name: lint charts
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
        with:
          version: ${{ env.CT_VERSION }}

      - name: Add extra Helm chart repositories
        if: ${{ inputs.extra-helm-repos != '' }}
        env:
          EXTRA_REPOS: ${{ inputs.extra-helm-repos }}
        run: |
          while IFS='=' read -r name url; do
            [ -z "${name}" ] && continue
            helm repo add "${name}" "${url}"
          done <<< "${EXTRA_REPOS}"

      - name: Update chart dependencies
        if: ${{ inputs.enable-dependency-update }}
        env:
          CHART_DIRS: ${{ inputs.chart-path }}
        run: |
          CHART_DIRS="$(dirname "${CHART_DIRS}")"
          find "${CHART_DIRS}" -maxdepth 1 ! -path "${CHART_DIRS}" -type d -exec helm dependency update {} \;

      - name: Run chart-testing (lint)
        env:
          CHART_DIRS: ${{ inputs.chart-path }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          LINT_CONFIG: ${{ inputs.lint-config }}
          LINT_ALL: ${{ inputs.lint-all }}
        run: |
          # maintainer validation requires every Chart.yaml to declare a
          # maintainers list with a valid GitHub/GitLab/Bitbucket account,
          # which most charts don't bother with; disabled by default here to
          # keep the workflow usable out of the box, same as the org's own
          # charts repo does in its ct.yaml.
          ARGS=(--chart-dirs "$(dirname "${CHART_DIRS}")" --target-branch "${TARGET_BRANCH}" --validate-maintainers=false)
          if [ -n "${LINT_CONFIG}" ]; then
            ARGS+=(--config "${LINT_CONFIG}")
          fi
          if [ "${LINT_ALL}" = "true" ]; then
            ARGS+=(--all)
          fi
          ct lint "${ARGS[@]}"

  install:
    name: install charts (k8s ${{ matrix.k8s-version }})
    runs-on: ubuntu-24.04
    if: ${{ inputs.enable-install }}
    needs:
      - lint
    strategy:
      fail-fast: false
      matrix:
        k8s-version: ${{ fromJSON(inputs.k8s-versions) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
        with:
          version: ${{ env.CT_VERSION }}

      - name: Add extra Helm chart repositories
        if: ${{ inputs.extra-helm-repos != '' }}
        env:
          EXTRA_REPOS: ${{ inputs.extra-helm-repos }}
        run: |
          while IFS='=' read -r name url; do
            [ -z "${name}" ] && continue
            helm repo add "${name}" "${url}"
          done <<< "${EXTRA_REPOS}"

      - name: Update chart dependencies
        if: ${{ inputs.enable-dependency-update }}
        env:
          CHART_DIRS: ${{ inputs.chart-path }}
        run: |
          CHART_DIRS="$(dirname "${CHART_DIRS}")"
          find "${CHART_DIRS}" -maxdepth 1 ! -path "${CHART_DIRS}" -type d -exec helm dependency update {} \;

      - name: Run chart-testing (list-changed)
        id: list-changed
        env:
          CHART_DIRS: ${{ inputs.chart-path }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
        run: |
          changed=$(ct list-changed --chart-dirs "$(dirname "${CHART_DIRS}")" --target-branch "${TARGET_BRANCH}")
          if [[ -n "${changed}" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create kind cluster
        if: ${{ steps.list-changed.outputs.changed == 'true' || inputs.install-all }}
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: kind-cluster-k8s-${{ matrix.k8s-version }}
          node_image: kindest/node:v${{ matrix.k8s-version }}

      - name: Run chart-testing (install)
        if: ${{ steps.list-changed.outputs.changed == 'true' || inputs.install-all }}
        env:
          CHART_DIRS: ${{ inputs.chart-path }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          INSTALL_CONFIG: ${{ inputs.install-config }}
          INSTALL_ALL: ${{ inputs.install-all }}
          HELM_EXTRA_SET_ARGS: ${{ inputs.helm-extra-set-args }}
        run: |
          ARGS=(--chart-dirs "$(dirname "${CHART_DIRS}")" --target-branch "${TARGET_BRANCH}")
          if [ -n "${INSTALL_CONFIG}" ]; then
            ARGS+=(--config "${INSTALL_CONFIG}")
          fi
          if [ "${INSTALL_ALL}" = "true" ]; then
            ARGS+=(--all)
          fi
          if [ -n "${HELM_EXTRA_SET_ARGS}" ]; then
            ARGS+=(--helm-extra-set-args "${HELM_EXTRA_SET_ARGS}")
          fi
          # freshly-created kind clusters can still be finishing up
          # ClusterIP/DNS/webhook wiring, so a first install attempt can race
          # that and fail transiently; retrying is simpler and more robust
          # than guessing a long-enough upfront sleep.
          for i in 1 2 3; do
            if ct install "${ARGS[@]}"; then
              exit 0
            fi
            echo "ct install failed (attempt ${i}/3), retrying in 10s..."
            sleep 10
          done
          exit 1

  publish:
    name: publish chart
    runs-on: ubuntu-24.04
    needs:
      - lint
    if: ${{ github.event_name == 'release' || (github.event_name == 'pull_request' && inputs.enable-pr-release) }}
    permissions:
      contents: read
      packages: write # to push the chart and its signature/attestation to ghcr.io
      id-token: write # for OIDC-based keyless cosign signing and attestations
      attestations: write # to publish the build provenance attestation
      artifact-metadata: write # required by actions/attest-build-provenance
    outputs:
      chart-name: ${{ steps.chart_meta.outputs.name }}
      chart-version: ${{ steps.chart_meta.outputs.version }}
      chart-digest: ${{ steps.push.outputs.digest }}
      chart-reference: ${{ steps.push.outputs.reference }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Update chart dependencies
        if: ${{ inputs.enable-dependency-update }}
        working-directory: ${{ inputs.chart-path }}
        run: |
          helm dependency update .

      - name: Read chart metadata
        id: chart_meta
        working-directory: ${{ inputs.chart-path }}
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
          APP_VERSION_OVERRIDE: ${{ inputs.app-version }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FULL_SHA: ${{ github.sha }}
        run: |
          NAME="$(yq '.name' Chart.yaml)"
          if [ -n "${VERSION_OVERRIDE}" ]; then
            VERSION="${VERSION_OVERRIDE}"
          elif [ "${EVENT_NAME}" = "release" ]; then
            # strip an optional leading "v", e.g. v1.2.3 -> 1.2.3
            VERSION="${RELEASE_TAG#v}"
          elif [ "${EVENT_NAME}" = "pull_request" ]; then
            VERSION="$(yq '.version' Chart.yaml)-pr${PR_NUMBER}.${FULL_SHA:0:7}"
          else
            VERSION="$(yq '.version' Chart.yaml)"
          fi
          APP_VERSION="${APP_VERSION_OVERRIDE:-$(yq '.appVersion' Chart.yaml)}"
          {
            echo "name=${NAME}"
            echo "version=${VERSION}"
            echo "app-version=${APP_VERSION}"
          } >> "${GITHUB_OUTPUT}"

      - name: Package chart
        id: package
        env:
          CHART_PATH: ${{ inputs.chart-path }}
          CHART_VERSION: ${{ steps.chart_meta.outputs.version }}
          CHART_APP_VERSION: ${{ steps.chart_meta.outputs.app-version }}
        run: |
          mkdir -p .chart-packages
          helm package "${CHART_PATH}" \
            --destination .chart-packages \
            --version "${CHART_VERSION}" \
            --app-version "${CHART_APP_VERSION}"
          echo "path=$(find .chart-packages -name '*.tgz')" >> "${GITHUB_OUTPUT}"

      # only push when not running on a pull_request from a fork, since forks
      # don't have access to the registry credentials.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.base.repo.full_name == github.event.pull_request.head.repo.full_name) }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token }}

      - name: Push chart to registry
        id: push
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.base.repo.full_name == github.event.pull_request.head.repo.full_name) }}
        env:
          CHART_PACKAGE: ${{ steps.package.outputs.path }}
          REGISTRY: ${{ inputs.registry }}
        run: |
          # helm writes the "Pushed:"/"Digest:" confirmation to stderr on
          # some versions and stdout on others, so capture both instead of
          # relying on either one specifically.
          helm push "${CHART_PACKAGE}" "oci://${REGISTRY}" > .push-output 2>&1
          cat .push-output
          {
            echo "reference=$(awk -F "[, ]+" '/Pushed:/{print $NF}' .push-output)"
            echo "digest=$(awk -F "[, ]+" '/Digest:/{print $NF}' .push-output)"
          } >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ inputs.enable-sign && (github.event_name != 'pull_request' || (github.event.pull_request.base.repo.full_name == github.event.pull_request.head.repo.full_name)) }}

      - name: Sign chart
        if: ${{ inputs.enable-sign && (github.event_name != 'pull_request' || (github.event.pull_request.base.repo.full_name == github.event.pull_request.head.repo.full_name)) }}
        env:
          CHART_REF: "${{ inputs.registry }}/${{ steps.chart_meta.outputs.name }}@${{ steps.push.outputs.digest }}"
        run: |
          echo "Signing '${CHART_REF}' using keyless approach"
          cosign sign --yes "${CHART_REF}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ inputs.enable-provenance-attestation && (github.event_name != 'pull_request' || (github.event.pull_request.base.repo.full_name == github.event.pull_request.head.repo.full_name)) }}
        with:
          subject-name: "${{ inputs.registry }}/${{ steps.chart_meta.outputs.name }}"
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
