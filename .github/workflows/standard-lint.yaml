name: Standard workflow for linting

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.30.1

on:
  workflow_call:
    inputs:
      enable-codeql:
        description: "Enable CodeQL analysis"
        required: false
        default: true
        type: boolean
      codeql-languages:
        description: "JSON array of languages to run CodeQL analysis for, e.g. '[\"java\", \"python\"]'. See <https://codeql.github.com/docs/codeql-overview/supported-languages-and-frameworks/> for the supported ones. The default only analyzes the repository's GitHub Actions workflows, which every repository calling this has."
        required: false
        default: '["actions"]'
        type: string
      enable-validate-gradle-wrapper:
        description: "Enable Gradle wrapper validation"
        required: false
        default: true
        type: boolean
      java-version:
        description: "The Java version CodeQL uses to resolve the dependencies of java code"
        required: false
        default: "21"
        type: string
      dotnet-version:
        description: "The .NET version CodeQL uses to resolve the dependencies of csharp code"
        required: false
        default: "10.0.x"
        type: string
    secrets:
      github-token:
        description: "Optional token override for MegaLinter's PR comments. Defaults to the MegaLinter job's own `github.token`, which is scoped to that job's permissions."
        required: false

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-26.04
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      issues: write # for megalinter to post PR comments via the issue comments API
      pull-requests: write # for megalinter to post PR comments
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # MegaLinter
      - name: MegaLinter
        id: ml
        # You can override MegaLinter flavor used to have faster performances
        # More info at https://megalinter.io/latest/flavors/
        uses: oxsecurity/megalinter@9949bad031045f366be2467e00e8371a7328a2e2 # v10.1.0
        env:
          VALIDATE_ALL_CODEBASE: "true"
          # only try to post PR comments if it's not a fork
          GITHUB_COMMENT_REPORTER: ${{ !github.event.pull_request.head.repo.fork }}
          GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          SARIF_REPORTER: "true"

      # Upload MegaLinter artifacts
      - name: Archive production artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log

  actionlint:
    name: actionlint
    runs-on: ubuntu-26.04
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: kjanat/actionlint@08bb2c4f0d039744455b87aef1c647fb8b66d37b # v1.17.0

  dependency-review:
    name: dependency review
    runs-on: ubuntu-26.04
    # can only run on PRs or the error is:
    # "Both a base ref and head ref must be provided, either via the `base_ref`/`head_ref` config options, or by running a `pull_request`/`pull_request_target` workflow."
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  gradle-wrapper-validation:
    name: validate gradle wrapper
    runs-on: ubuntu-26.04
    if: ${{ inputs.enable-validate-gradle-wrapper }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  codeql-analyze:
    name: CodeQL analyze
    runs-on: ubuntu-26.04
    if: ${{ inputs.enable-codeql }}
    permissions:
      actions: read # required by github/codeql-action to upload SARIF results
      contents: read
      security-events: write # for uploading CodeQL SARIF results
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.codeql-languages) }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java
        if: ${{ contains(fromJSON('["java", "java-kotlin", "kotlin"]'), matrix.language) }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ inputs.java-version }}
          distribution: "temurin"
          cache: gradle

      - name: Set up .NET
        if: ${{ matrix.language == 'csharp' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          # analyze the source without building it wherever CodeQL supports that
          # (all interpreted languages, java, csharp, c-cpp and rust). go and kotlin
          # can't be analyzed without a build, so CodeQL builds those itself.
          build-mode: ${{ contains(fromJSON('["go", "kotlin"]'), matrix.language) && 'autobuild' || 'none' }}
          queries: +security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"

  zizmor:
    name: zizmor scan
    runs-on: ubuntu-26.04
    # also runs on the default branch so code scanning has a baseline to compare
    # the results of pull requests against.
    if: ${{ github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      security-events: write # for uploading zizmor SARIF results
      contents: read
      actions: read # required by github/codeql-action to upload SARIF results
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Create standard zizmor rules file
        env:
          ZIZMOR_CONFIG_YAML: |
            rules:
              undocumented-permissions:
                disable: true
              concurrency-limits:
                disable: true
        run: |
          echo "${ZIZMOR_CONFIG_YAML}" > /tmp/zizmor-standard-lint-defaults.yaml

      - name: Run zizmor (sarif)
        run: |
          uvx "zizmor@${ZIZMOR_VERSION}" --pedantic --format sarif . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIZMOR_CONFIG: /tmp/zizmor-standard-lint-defaults.yaml

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
          category: zizmor

      # only pull requests are gated on findings, the default branch just uploads its results
      - name: Run zizmor (fail on findings)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          uvx "zizmor@${ZIZMOR_VERSION}" --verbose --pedantic --format plain .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIZMOR_CONFIG: /tmp/zizmor-standard-lint-defaults.yaml
