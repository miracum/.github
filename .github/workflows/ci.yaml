name: ci

on:
  push:
    branches: [master]
  release:
    types: [created]
  pull_request:
    branches: [master]

# cancel superseded PR runs, but let master pushes/releases run to completion
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    uses: $/.github/workflows/standard-build.yaml
    permissions:
      contents: write # to upload SBOMs and SLSA attestations to release assets
      id-token: write # for keyless image signing and OIDC-based attestations
      packages: write # to push the image and its attestations to ghcr.io
      pull-requests: write # for the trivy scan PR comment
      security-events: write # for uploading trivy scan results to the security tab
      attestations: write # to publish build provenance attestations
      artifact-metadata: write # required by actions/attest-build-provenance
    with:
      # can't use the default "ghcr.io/${{ github.repository }}" since
      # "ghcr.io/miracum/.github:pr-1": invalid reference format"
      image: ghcr.io/miracum/github-reusable-workflow
      enable-build-test-layer: true
      enable-upload-test-image: true
      enable-buildkit-cache-mount-caching: true
      platforms: linux/amd64,linux/arm64
      free-disk-space: true
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  build-without-test-image:
    uses: $/.github/workflows/standard-build.yaml
    permissions:
      contents: write # to upload SBOMs and SLSA attestations to release assets
      id-token: write # for keyless image signing and OIDC-based attestations
      packages: write # to push the image and its attestations to ghcr.io
      pull-requests: write # for the trivy scan PR comment
      security-events: write # for uploading trivy scan results to the security tab
      attestations: write # to publish build provenance attestations
      artifact-metadata: write # required by actions/attest-build-provenance
    with:
      image: ghcr.io/miracum/github-reusable-workflow-without-test-image
      enable-build-test-layer: false
      enable-upload-test-image: false
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  build-with-fixed-image-tags:
    uses: $/.github/workflows/standard-build.yaml
    permissions:
      contents: write # to upload SBOMs and SLSA attestations to release assets
      id-token: write # for keyless image signing and OIDC-based attestations
      packages: write # to push the image and its attestations to ghcr.io
      pull-requests: write # for the trivy scan PR comment
      security-events: write # for uploading trivy scan results to the security tab
      attestations: write # to publish build provenance attestations
      artifact-metadata: write # required by actions/attest-build-provenance
    with:
      image: ghcr.io/miracum/github-reusable-workflow-with-fixed-image-tags
      enable-build-test-layer: true
      enable-upload-test-image: true
      image-tags: |
        type=semver,pattern={{raw}},value=v1.2.3-beta.123
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  lint:
    uses: $/.github/workflows/standard-lint.yaml
    permissions:
      contents: read
      pull-requests: write # for megalinter to post PR comments
      issues: write # for megalinter to post PR comments via the issue comments API
      security-events: write # for uploading CodeQL and zizmor SARIF results
      actions: read # required by the codeql-analyze/zizmor jobs in standard-lint.yaml
    with:
      codeql-languages: '["python"]'
      enable-codeql: true
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-24.04
    name: test
    needs:
      - build
    steps:
      # <https://docs.docker.com/storage/containerd/>
      # via <https://github.com/docker/setup-buildx-action/issues/257>
      - name: Set up containerd image store
        shell: bash
        run: |
          [ -f /etc/docker/daemon.json ] || echo "{}" | sudo tee /etc/docker/daemon.json
          jq '. | .+{"features": {"containerd-snapshotter": true}}' /etc/docker/daemon.json > /tmp/docker-daemon-with-containerd.json
          sudo mv /tmp/docker-daemon-with-containerd.json /etc/docker/daemon.json
          cat /etc/docker/daemon.json
          sudo systemctl restart docker

          docker info -f '{{ .DriverStatus }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Download build image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          name: ${{ needs.build.outputs.image-slug }}
          path: /tmp

      - name: Download test image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ github.event_name == 'pull_request' }}
        with:
          name: ${{ needs.build.outputs.image-slug }}-test
          path: /tmp

      - name: ls
        run: |
          ls -lsa /tmp

      - name: load image
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          docker load --input /tmp/image.tar
          docker load --input /tmp/image-test.tar

      - name: list images
        run: |
          docker image ls

  release:
    uses: $/.github/workflows/standard-release.yaml
    needs:
      - build
      - test
    permissions:
      contents: write # for semantic-release to create tags, releases, and push version commits
      pull-requests: write # for semantic-release to comment on related PRs
      issues: write # for semantic-release to comment on related issues
    secrets:
      semantic-release-token: ${{ secrets.GITHUB_TOKEN }}
