name: Standard workflow for building a container image from a Dockerfile

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: 0.74.0

on:
  workflow_call:
    inputs:
      image:
        description: "Name of the image to build and push, including its registry but excluding any tags"
        required: false
        default: "ghcr.io/${{ github.repository }}"
        type: string
      build-context:
        description: "The directory containing the Containerfile used to build the image"
        required: false
        default: "."
        type: string
      build-args:
        description: "List of build arguments to pass to the image build step. Never pass secrets here: non-PR builds publish a `mode=max` SLSA provenance attestation alongside the image, which records every build argument's value in plain text for anyone who can pull the image."
        required: false
        type: string
      enable-upload-image:
        description: "If enabled, upload the image as a build artifact"
        required: false
        default: true
        type: boolean
      enable-build-test-layer:
        description: "If enabled, builds a layer called `test` inside the Dockerfile. Useful for unit testing."
        required: false
        default: false
        type: boolean
      enable-upload-test-image:
        description: "If enabled, uploads the image built from the test layer as an artifact."
        required: false
        default: false
        type: boolean
      enable-trivy-scan:
        description: "If enabled, scan the image using trivy and publish a signed attestation"
        required: false
        default: true
        type: boolean
      trivy-ignore-unfixed:
        description: "Ignore unfixed/unfixable vulnerabilities in reports"
        required: false
        default: true
        type: boolean
      image-tags:
        description: "If set, overwrite the default image tags. See <https://github.com/docker/metadata-action?tab=readme-ov-file#tags-input> for the format and usage."
        required: false
        default: ""
        type: string
      platforms:
        description: "List of target platforms for build"
        required: false
        type: string
        default: |
          linux/amd64
      free-disk-space:
        description: remove unneeded packages
        required: false
        type: boolean
        default: true
      enable-buildkit-cache-mount-caching:
        description: "If enabled, persists the contents of any `RUN --mount=type=cache` mounts in the Dockerfile (e.g. package manager or build caches) across builds using reproducible-containers/buildkit-cache-dance and actions/cache."
        required: false
        default: false
        type: boolean
      enable-build-cache:
        description: "If enabled, caches image layers across builds by pushing/pulling a `<image>:buildcache` tag (and `<image>:buildcache-test` for the test layer) to/from the same registry the built image itself is pushed to. Disable for Dockerfiles that get more value from enable-buildkit-cache-mount-caching than from layer caching, to skip the extra registry round-trip."
        required: false
        default: true
        type: boolean
    outputs:
      image-tags:
        value: ${{ jobs.build.outputs.image-tags }}
        description: "The built image tags"
      image-version:
        value: ${{ jobs.build.outputs.image-version }}
        description: "The built image version"
      image-meta-json:
        value: ${{ jobs.build.outputs.image-meta-json }}
        description: "The built image meta data in JSON format"
      image-digest:
        value: ${{ jobs.build.outputs.image-digest }}
        description: "The built image digest"
      test-image-tags:
        value: ${{ jobs.build.outputs.test-image-tags }}
        description: "The test image tags"
      test-image-meta-json:
        value: ${{ jobs.build.outputs.test-image-meta-json }}
        description: "The test image meta data in JSON format"
      test-image-digest:
        value: ${{ jobs.build.outputs.test-image-digest }}
        description: "The test image digest"
      test-image-version:
        value: ${{ jobs.build.outputs.test-image-version }}
        description: "The built image version"
      image-slug:
        value: ${{ jobs.build.outputs.image-slug }}
        description: "The name of the build image in slugified form. This is the name of the artifact where the image was uploaded to."
    secrets:
      github-token:
        description: "Optional token override for pushing to ghcr.io and downloading attestations. Defaults to each job's own `github.token`, which is scoped to that job's permissions - only pass this if that token isn't sufficient, e.g. to push to another organization's registry."
        required: false

jobs:
  build:
    name: build image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write # to push the image to ghcr.io
      pull-requests: write # for the trivy PR comment
    outputs:
      image-version: ${{ steps.image_meta.outputs.version }}
      image-tags: ${{ steps.image_meta.outputs.tags }}
      image-meta-json: ${{ steps.image_meta.outputs.json }}
      image-digest: ${{ steps.image_digest.outputs.digest }}
      test-image-version: ${{ steps.tests_image_meta.outputs.version }}
      test-image-tags: ${{ steps.tests_image_meta.outputs.tags }}
      test-image-meta-json: ${{ steps.tests_image_meta.outputs.json }}
      test-image-digest: ${{ steps.build_test.outputs.digest }}
      image-slug: ${{ steps.slugify-image.outputs.slug }}
    env:
      # false only for pull requests from forks: their token is read-only and they
      # get no secrets, so nothing can be pushed to the registry or commented.
      CAN_WRITE: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.repo.full_name == github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          # zizmor: runtime artifacts potentially vulnerable to a cache poisoning attack
          cache-binary: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Free disk space
        if: ${{ inputs.free-disk-space }}
        uses: endersonmenezes/free-disk-space@2a22f8c59cae9cddae7194b33e6b92d023b2b4b8 # v4.0.0
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          rm_cmd: "rmz"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ env.CAN_WRITE == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token || github.token }}

      - name: Container image meta
        id: image_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ inputs.image }}
          tags: |
            ${{ inputs.image-tags }}

      - name: Container meta for the test image
        id: tests_image_meta
        if: ${{ inputs.enable-build-test-layer == true }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ inputs.image }}-test

      - name: Cache buildkit cache mounts
        id: buildkit-cache-mount
        if: ${{ inputs.enable-buildkit-cache-mount-caching }}
        # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: buildkit-cache-mount
          key: buildkit-cache-mount-${{ runner.os }}-${{ inputs.image }}-${{ hashFiles(format('{0}/Dockerfile', inputs.build-context)) }}
          restore-keys: |
            buildkit-cache-mount-${{ runner.os }}-${{ inputs.image }}-

      # restores the contents of any `RUN --mount=type=cache` mounts declared in the Dockerfile
      # into the builder before the build, and saves them back to the cache dir above afterwards
      # (via the action's post step) - see <https://github.com/reproducible-containers/buildkit-cache-dance>
      - name: Restore buildkit cache mounts
        if: ${{ inputs.enable-buildkit-cache-mount-caching }}
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: buildkit-cache-mount
          dockerfile: ${{ inputs.build-context }}/Dockerfile
          skip-extraction: ${{ steps.buildkit-cache-mount.outputs.cache-hit }}

      # ran first to avoid pushing failing images when running on master.
      - name: Build unit test image layer
        if: ${{ inputs.enable-build-test-layer == true }}
        id: build_test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.build-context }} # zizmor: ignore[template-injection]
          push: false
          load: true
          outputs: type=oci,dest=./image-test.tar,oci-mediatypes=true,compression=zstd,force-compression=true
          tags: ${{ steps.tests_image_meta.outputs.tags }}
          labels: ${{ steps.tests_image_meta.outputs.labels }}
          # a separate cache ref from the main image build below: both export to the
          # registry, so sharing one ref would let the main build's export replace
          # this one and the layers only the test stage uses would never be cached.
          #
          # the cache export must use the same compression as the outputs: exporting a
          # gzip cache (the default) of force-compressed zstd layers makes BuildKit's
          # memory balloon until it is OOM-killed ("error reading from server: EOF").
          cache-from: ${{ inputs.enable-build-cache && format('type=registry,ref={0}:buildcache-test', inputs.image) || '' }} # zizmor: ignore[template-injection]
          cache-to: ${{ inputs.enable-build-cache && env.CAN_WRITE == 'true' && format('type=registry,ref={0}:buildcache-test,mode=max,oci-mediatypes=true,compression=zstd,force-compression=true', inputs.image) || '' }} # zizmor: ignore[template-injection]
          target: test
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}

      - uses: rlespinasse/slugify-value@f13019fcc1d95a391d12b618028b003adf29ebca # v1.4.1
        id: slugify-image
        with:
          key: BUILD_IMAGE
          value: ${{ steps.image_meta.outputs.json && fromJson(steps.image_meta.outputs.json).tags[0] }}
          publish-env: false
          slug-maxlength: nolimit

      - name: Upload test image
        if: ${{ (inputs.enable-build-test-layer == true) && (inputs.enable-upload-test-image == true) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.slugify-image.outputs.slug }}-test
          path: |
            ${{ github.workspace }}/image-test.tar

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.build-context }} # zizmor: ignore[template-injection]
          # when in a PR, save the image as a tar archive
          # this way, we can save it as an artifact in later steps
          # otherwise (on branch-push or releases), push the image to
          # the registry
          #
          # the registry push is expressed as a second `outputs` entry rather
          # than the `push` input: buildx's `--push` shorthand creates its own
          # implicit output that does not inherit the compression settings of
          # explicitly-specified outputs, silently falling back to gzip.
          load: ${{ github.event_name == 'pull_request' }}
          outputs: |
            type=oci,dest=./image.tar,oci-mediatypes=true,compression=zstd,force-compression=true
            ${{ env.CAN_WRITE == 'true' && 'type=image,push=true,oci-mediatypes=true,compression=zstd,force-compression=true' || '' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          # mode=max records the complete build definition (LLB, Dockerfile, source
          # maps) instead of just the materials and source revision, but that also
          # includes the value of every build-arg - see the build-args input.
          # <https://docs.docker.com/build/metadata/attestations/slsa-provenance/>
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || false }}
          tags: ${{ steps.image_meta.outputs.tags }}
          labels: ${{ steps.image_meta.outputs.labels }}
          cache-from: ${{ inputs.enable-build-cache && format('type=registry,ref={0}:buildcache', inputs.image) || '' }} # zizmor: ignore[template-injection]
          # same compression as the outputs - see the cache-to comment of the test layer build
          cache-to: ${{ inputs.enable-build-cache && env.CAN_WRITE == 'true' && format('type=registry,ref={0}:buildcache,mode=max,oci-mediatypes=true,compression=zstd,force-compression=true', inputs.image) || '' }} # zizmor: ignore[template-injection]
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}

      # a crashed BuildKit daemon only shows up as "error reading from server: EOF"
      # in the build output - its own logs and container state show why it died
      # (e.g. a Go panic vs. being OOM-killed).
      - name: Show BuildKit daemon logs
        if: ${{ failure() }}
        env:
          BUILDKIT_CONTAINER: buildx_buildkit_${{ steps.setup-buildx.outputs.name }}0
        run: |
          docker inspect --format 'restarts: {{.RestartCount}}, running: {{.State.Running}}, exit code: {{.State.ExitCode}}, OOM killed: {{.State.OOMKilled}}' "${BUILDKIT_CONTAINER}" || true
          sudo dmesg | grep -i -E 'out of memory|oom-kill|killed process' | tail -n 5 || true
          docker logs --tail 300 "${BUILDKIT_CONTAINER}" 2>&1 || true

      # the build step's own `digest` output can't be used as the image digest: with more than one
      # exporter, buildx reports only one of their digests, and on pull requests that is the one of
      # the image loaded into the local Docker daemon. `load` creates its own implicit exporter that
      # does not inherit the compression and media types of the explicit outputs, so its manifest -
      # and digest - differs from the pushed one, and the reported digest doesn't exist in the
      # registry. The OCI tarball is exported with the exact same settings as the registry push
      # (including the attestations on non-PR builds), so its digest is the one of the pushed image.
      - name: Determine image digest
        id: image_digest
        env:
          IMAGE_TAR: ${{ github.workspace }}/image.tar
        run: |
          index="$(tar -xOf "${IMAGE_TAR}" index.json)"
          # the index contains one entry per tag, all referencing the same manifest
          digests="$(jq -r '[.manifests[].digest] | unique | .[]' <<<"${index}")"
          if [ "$(wc -l <<<"${digests}")" != "1" ] || [ -z "${digests}" ]; then
            echo "::error::expected exactly one manifest digest in the OCI tarball's index.json, got: ${index}"
            exit 1
          fi
          digest="${digests}"
          echo "image digest: ${digest}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Upload container image
        if: ${{ github.event_name == 'pull_request' && inputs.enable-upload-image == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.slugify-image.outputs.slug }}
          path: |
            ${{ github.workspace }}/image.tar

      - name: display images
        run: |
          docker image ls -a

      # the first trivy-action call installs trivy and restores the trivy DB cache
      # into the (shared) default cache-dir. Subsequent calls reuse both instead of
      # re-running setup-trivy and each trying to save the same cache entry again.
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TMPDIR: /tmp
        with:
          version: v${{ env.TRIVY_VERSION }}
          image-ref: ${{ fromJson(steps.image_meta.outputs.json).tags[0] }}
          format: cyclonedx
          output: ${{ steps.slugify-image.outputs.slug }}-sbom.cdx.json

      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TMPDIR: /tmp
        with:
          skip-setup-trivy: true
          cache: false
          image-ref: ${{ fromJson(steps.image_meta.outputs.json).tags[0] }}
          format: spdx-json
          output: ${{ steps.slugify-image.outputs.slug }}-sbom.spdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.slugify-image.outputs.slug }}-sboms
          path: |
            ${{ steps.slugify-image.outputs.slug }}-sbom.cdx.json
            ${{ steps.slugify-image.outputs.slug }}-sbom.spdx.json

      - name: Create Trivy vulnerability attestation
        if: ${{ inputs.enable-trivy-scan }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TMPDIR: /tmp
        with:
          skip-setup-trivy: true
          cache: false
          image-ref: ${{ fromJson(steps.image_meta.outputs.json).tags[0] }}
          exit-code: "0"
          format: cosign-vuln
          output: trivy-vuln-attestation.json
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}

      - name: Upload image vulnerability attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ inputs.enable-trivy-scan }}
        with:
          name: ${{ steps.slugify-image.outputs.slug }}-trivy-attestation
          path: |
            trivy-vuln-attestation.json

      - name: Download PR comment template
        if: ${{ github.event_name == 'pull_request' && inputs.enable-trivy-scan }}
        env:
          # the template lives next to this reusable workflow, so fetch it from the
          # exact commit the caller pinned the workflow to instead of from master.
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          curl -fsSL -o trivy-pr-report.md.tpl \
            "https://raw.githubusercontent.com/${WORKFLOW_REPOSITORY}/${WORKFLOW_SHA}/.github/trivy-pr-report.md.tpl"

      - name: Run Trivy vulnerability scanner for PR comment
        if: ${{ github.event_name == 'pull_request' && inputs.enable-trivy-scan }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          skip-setup-trivy: true
          cache: false
          image-ref: ${{ fromJson(steps.image_meta.outputs.json).tags[0] }}
          exit-code: "0"
          format: template
          template: "@trivy-pr-report.md.tpl"
          output: trivy-pr-report.md
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}

      # GitHub rejects comments longer than 65536 characters, which the detail
      # tables for an image with many vulnerabilities can exceed.
      - name: Check PR comment size
        id: pr-report-size
        if: ${{ github.event_name == 'pull_request' && inputs.enable-trivy-scan }}
        run: |
          # bytes are at least as many as characters, and the margin leaves room
          # for the marker the sticky comment action adds.
          if [ "$(wc -c < trivy-pr-report.md)" -gt 65000 ]; then
            echo "too-large=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload full trivy report
        id: upload-pr-report
        if: ${{ steps.pr-report-size.outputs.too-large == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.slugify-image.outputs.slug }}-trivy-pr-report
          path: trivy-pr-report.md

      - name: Replace the PR comment's detail tables with a link to the full report
        if: ${{ steps.pr-report-size.outputs.too-large == 'true' }}
        env:
          ARTIFACT_URL: ${{ steps.upload-pr-report.outputs.artifact-url }}
        run: |
          # the headings hold the per-target summary (e.g. vulnerability counts by severity)
          summary="$(grep -E '^<h[234]>' trivy-pr-report.md)"
          {
            echo "${summary}"
            echo ""
            echo "<p>The detailed report is too large for a PR comment: <a href=\"${ARTIFACT_URL}\">download the full report</a>.</p>"
          } > trivy-pr-report.md

      - name: Add trivy report PR comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        # when running from a fork, the CI token doesn't have enough permissions to create PR comments
        if: ${{ github.event_name == 'pull_request' && inputs.enable-trivy-scan && env.CAN_WRITE == 'true' }}
        with:
          recreate: true
          header: "trivy-report-comment-${{ steps.slugify-image.outputs.slug }}"
          path: trivy-pr-report.md

    # requires content: write access
    #   - name: Run Trivy in GitHub SBOM mode and submit results to Dependency Graph
    #     uses: aquasecurity/trivy-action@fbd16365eb88e12433951383f5e99bd901fc618f # 0.12.0
    #     if: ${{ github.event_name != 'pull_request' }}
    #     with:
    #       image-ref: ${{ fromJson(steps.image_meta.outputs.json).tags[0] }}
    #       format: "github"
    #       output: "dependency-results.sbom.json"
    #       github-pat: ${{ secrets.github-token }}

  # Signs the image and pushes the provenance and vulnerability report
  # attestations to it.
  #
  # ghcr.io doesn't support the OCI 1.1 referrers API, so cosign/attest fall
  # back to a single mutable "sha256-<digest>" tag holding an index of all
  # referrers (signature, provenance, vuln attestation) for the image. Pushing
  # them in parallel races read-modify-write updates to that tag and can
  # silently drop a referrer, so they run as sequential steps of one job.
  #
  # This must not be split into one job per referrer sharing a concurrency
  # group: a group only holds one running and one *pending* job, so the third
  # job to enter it cancels the second ("Canceling since a higher priority
  # waiting request ... exists"), even with cancel-in-progress: false.
  #
  # The group is scoped to the image+digest (not github.run_id) so it also
  # serializes across *separate* runs that happen to build the same digest
  # (e.g. several unrelated commits landing back to back without touching the
  # Dockerfile) -- run_id would only protect against races within a single run.
  attest-and-sign-image:
    name: attest and sign image
    runs-on: ubuntu-26.04
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - build
    concurrency:
      group: attest-referrers-${{ inputs.image }}@${{ needs.build.outputs.image-digest }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # for OIDC-based keyless signing and attestation
      attestations: write # to publish the build provenance attestation
      artifact-metadata: write # required by actions/attest-build-provenance
      packages: write # for pushing the signature and attestations to ghcr.io.
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token || github.token }}

      - name: Attest build provenance
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ needs.build.outputs.image-digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        env:
          IMAGE: "${{ inputs.image }}@${{ needs.build.outputs.image-digest }}"
        run: |
          echo "Signing '$IMAGE' using keyless approach"
          cosign sign --yes "${IMAGE}"

      - name: Download trivy attestation
        if: ${{ inputs.enable-trivy-scan }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.image-slug }}-trivy-attestation
          path: /tmp

      - name: Attest image vulnerability report
        if: ${{ inputs.enable-trivy-scan }}
        env:
          IMAGE: "${{ inputs.image }}@${{ needs.build.outputs.image-digest }}"
        run: |
          echo "Attest vulnerability report for '$IMAGE' using keyless approach"
          cosign attest --yes --type vuln --predicate /tmp/trivy-vuln-attestation.json "$IMAGE"

  upload-attestation-to-release:
    name: upload slsa attestations to release assets
    runs-on: ubuntu-26.04
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs:
      - attest-and-sign-image
      - build
    permissions:
      contents: write # to upload artifacts to the release
      attestations: read # for gh attestation download
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: download attestation from image
        env:
          GH_TOKEN: ${{ secrets.github-token || github.token }}
          IMAGE: "${{ inputs.image }}@${{ needs.build.outputs.image-digest }}"
          IMAGE_DIGEST: "${{ needs.build.outputs.image-digest }}"
          IMAGE_SLUG: "${{ needs.build.outputs.image-slug }}"
          REPO: ${{ github.repository }}
        run: |
          gh attestation download "oci://${IMAGE}" \
            --repo="${REPO}" \
            --predicate-type="https://slsa.dev/provenance/v1"
          mv "${IMAGE_DIGEST}.jsonl" "$IMAGE_SLUG.intoto.jsonl"

      - name: upload assets to release
        # zizmor: ignore[superfluous-actions] upload release assets directly
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            *.intoto.jsonl

  upload-sbom-to-release:
    name: upload image SBOMs to release assets
    runs-on: ubuntu-26.04
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs:
      - build
    permissions:
      contents: write # to upload artifacts to the release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # change to 'egress-policy: block' after couple of runs

      - name: Download sboms
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.image-slug }}-sboms
          path: ./sboms

      - name: Display structure of downloaded files
        run: ls -R .

      - name: upload assets to release
        # zizmor: ignore[superfluous-actions] upload release assets directly
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          fail_on_unmatched_files: true
          files: |
            ./sboms/*.json
